name: Native desktop comparison
run-name: "Native desktop comparison: ${{ inputs.platforms }} / ${{ inputs.framework || 'all' }} × ${{ inputs.repetitions }}"

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Choose Windows, macOS, native pair, Linux X11, or all three'
        type: choice
        options: [native, windows, macos, linux, all]
        default: all
      framework:
        description: 'all or comma-separated egui,gtk,slint,qt,tauri'
        type: string
        default: all
      comparison:
        description: 'Measure idle CPU/memory: 30s settling, 120 intervals; Linux also minimized'
        type: boolean
        default: true
      appearance:
        description: 'Relaunch each app with the OS switched to dark mode and capture it (first repetition only)'
        type: boolean
        default: true
      repetitions:
        description: 'Independent repetitions per OS, each on a fresh runner VM, to expose outliers'
        type: choice
        options: ['1', '3', '5']
        default: '5'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        repetition: ${{ fromJSON(inputs.repetitions == '1' && '[1]' || inputs.repetitions == '3' && '[1,2,3]' || '[1,2,3,4,5]') }}
        os: ${{ fromJSON(inputs.platforms == 'windows' && '["windows-2022"]' || inputs.platforms == 'macos' && '["macos-15"]' || inputs.platforms == 'linux' && '["ubuntu-24.04"]' || inputs.platforms == 'all' && '["windows-2022","macos-15","ubuntu-24.04"]' || '["windows-2022","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      COMPARISON: ${{ inputs.comparison }}
      FRAMEWORK: ${{ inputs.framework }}
      APPEARANCE: ${{ inputs.appearance == true && matrix.repetition == 1 }}
      REPETITION: ${{ matrix.repetition }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: probe_python
        with:
          python-version: '3.12'
      - name: Validate selected frameworks
        run: |
          "${{ steps.probe_python.outputs.python-path }}" - <<'PY'
          import json
          import os
          from pathlib import Path
          names = ('egui', 'gtk', 'slint', 'qt', 'tauri')
          requested = [name.strip() for name in os.environ['FRAMEWORK'].split(',')]
          if requested == ['all']:
              selected = list(names)
          else:
              assert all(requested), 'Framework selection must not contain empty entries'
              assert len(requested) == len(set(requested)), 'Duplicate framework selection'
              assert all(name in names for name in requested), f'Unknown framework selection: {requested}'
              selected = [name for name in names if name in requested]
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write('SELECTED_FRAMEWORKS=' + json.dumps(selected) + '\n')
              output.write('FRAMEWORK=' + ','.join(selected) + '\n')
              output.write('NEED_RUST=' + str(bool(set(selected) & {'egui', 'gtk', 'slint', 'tauri'})).lower() + '\n')
          print('Selected frameworks: ' + ', '.join(selected))
          PY
      - uses: dtolnay/rust-toolchain@stable
        if: env.NEED_RUST == 'true'
      - name: Prepare probe and evidence directory
        run: |
          mkdir -p artifacts/build target
          PROBE_PYTHON="${{ steps.probe_python.outputs.python-path }}"
          echo "PROBE_PYTHON=$PROBE_PYTHON" >> "$GITHUB_ENV"
          "$PROBE_PYTHON" -m pip install psutil==7.0.0 Pillow==11.2.1
          if [ "$RUNNER_OS" = macOS ]; then
            "$PROBE_PYTHON" -m pip install pyobjc-framework-Quartz==11.0
          fi
          "$PROBE_PYTHON" -c 'import sys, psutil, PIL; print(sys.executable)' > artifacts/build/probe-python.txt
          if [ "$NEED_RUST" = true ]; then
            rustc -Vv > artifacts/build/rust-version.txt
            cargo -V >> artifacts/build/rust-version.txt
          fi
          if [[ ",$FRAMEWORK," == *,qt,* ]]; then
            cmake --version > artifacts/build/cmake-version.txt
          fi
      - name: Probe accounting and attribution checks
        run: '"$PROBE_PYTHON" -m unittest discover -s tools -p "test_*.py"'
      - name: Linux build and X11 runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgtk-4-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev qt6-base-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev xvfb openbox xdotool x11-utils imagemagick dbus-x11 mesa-utils xdg-desktop-portal xdg-desktop-portal-gtk gsettings-desktop-schemas dconf-service dconf-cli libglib2.0-bin
          pkg-config --modversion gtk4 webkit2gtk-4.1 Qt6Widgets > artifacts/build/native-versions.txt
      - name: Qt 6.8.3 for Windows
        if: runner.os == 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'qt')
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: false
      - name: GTK4 Windows toolchain
        if: runner.os == 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'gtk')
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-rust
      - name: Build gtk4-rs example on Windows
        if: runner.os == 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'gtk')
        continue-on-error: true
        shell: msys2 {0}
        run: bash tools/windows-setup.sh
      - name: Native macOS libraries
        if: runner.os == 'macOS' && (contains(env.SELECTED_FRAMEWORKS, 'qt') || contains(env.SELECTED_FRAMEWORKS, 'gtk'))
        continue-on-error: true
        run: |
          packages=(pkgconf)
          if [[ ",$FRAMEWORK," == *,qt,* ]]; then packages+=(qtbase); fi
          if [[ ",$FRAMEWORK," == *,gtk,* ]]; then packages+=(gtk4); fi
          brew install "${packages[@]}" 2>&1 | tee artifacts/build/brew.log
          brew list --versions "${packages[@]}" > artifacts/build/native-versions.txt
          if [[ ",$FRAMEWORK," == *,qt,* ]]; then
            echo "Qt6_DIR=$(brew --prefix qtbase)/lib/cmake/Qt6" >> "$GITHUB_ENV"
          fi
      - name: Record Windows WebView2 installation
        if: runner.os == 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'tauri')
        shell: pwsh
        run: |
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue
          if ($runtime) {
            $runtime | ForEach-Object { $_.VersionInfo.FileVersion } | Out-File artifacts/build/webview2-version.txt
          } else {
            'WebView2 runtime not found in standard machine install directory; launch will validate availability.' | Out-File artifacts/build/webview2-version.txt
          }
      - name: Build egui release
        if: contains(env.SELECTED_FRAMEWORKS, 'egui')
        continue-on-error: true
        timeout-minutes: 15
        run: |
          cargo fmt --manifest-path examples/egui/Cargo.toml
          mkdir -p artifacts/build/formatted/egui/src
          cp examples/egui/src/main.rs artifacts/build/formatted/egui/src/main.rs
          cp examples/egui/Cargo.lock artifacts/build/egui-Cargo.lock
          cargo build --release --locked --manifest-path examples/egui/Cargo.toml 2>&1 | tee artifacts/build/egui.log
      - name: Resolve missing new-example locks and preserve exact resolution
        if: contains(env.SELECTED_FRAMEWORKS, 'gtk') || contains(env.SELECTED_FRAMEWORKS, 'slint') || contains(env.SELECTED_FRAMEWORKS, 'tauri')
        continue-on-error: true
        run: |
          status=0
          for example in gtk slint tauri; do
            if [[ ",$FRAMEWORK," != *,"$example",* ]]; then continue; fi
            cargo fmt --manifest-path "examples/$example/Cargo.toml" 2>&1 | tee "artifacts/build/$example-format.log" || status=1
            mkdir -p "artifacts/build/formatted/$example/src"
            cp "examples/$example/src/main.rs" "artifacts/build/formatted/$example/src/main.rs"
            if [ -f "examples/$example/build.rs" ]; then
              cp "examples/$example/build.rs" "artifacts/build/formatted/$example/build.rs"
            fi
            if [ ! -f "examples/$example/Cargo.lock" ]; then
              cargo generate-lockfile --manifest-path "examples/$example/Cargo.toml" 2>&1 | tee "artifacts/build/$example-resolution.log" || status=1
            fi
            if [ -f "examples/$example/Cargo.lock" ]; then
              cp "examples/$example/Cargo.lock" "artifacts/build/$example-Cargo.lock"
            else
              status=1
            fi
          done
          exit "$status"
      - name: Build Slint release
        if: contains(env.SELECTED_FRAMEWORKS, 'slint')
        continue-on-error: true
        timeout-minutes: 15
        run: cargo build --release --locked --manifest-path examples/slint/Cargo.toml 2>&1 | tee artifacts/build/slint.log
      - name: Build Tauri release
        if: contains(env.SELECTED_FRAMEWORKS, 'tauri')
        continue-on-error: true
        timeout-minutes: 15
        run: cargo build --release --locked --manifest-path examples/tauri/Cargo.toml 2>&1 | tee artifacts/build/tauri.log
      - name: Build Qt Widgets release
        if: contains(env.SELECTED_FRAMEWORKS, 'qt')
        continue-on-error: true
        run: |
          cmake -S examples/qt -B target/qt -DCMAKE_BUILD_TYPE=Release 2>&1 | tee artifacts/build/qt-configure.log
          cmake --build target/qt --config Release 2>&1 | tee artifacts/build/qt-build.log
          if [ "$RUNNER_OS" = Windows ]; then
            windeployqt --release --no-translations target/qt/Release/veranda-qt-comparison.exe 2>&1 | tee artifacts/build/qt-deploy.log
          else
            # The Rust examples use strip = true; strip Qt too so executable sizes compare.
            strip target/qt/veranda-qt-comparison
          fi
      - name: Build gtk4-rs example on Unix
        if: runner.os != 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'gtk')
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pkg-config --modversion gtk4 > artifacts/build/gtk-version.txt
          cargo build --release --locked --manifest-path examples/gtk/Cargo.toml 2>&1 | tee artifacts/build/gtk.log
      - name: Run selected candidates sequentially on this runner
        timeout-minutes: 35
        run: |
          "$PROBE_PYTHON" -c 'import sys, psutil, PIL; print(sys.executable)' >> artifacts/build/probe-python.txt
          cat > artifacts/run_candidates.py <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import psutil

          windows = sys.platform == 'win32'
          extension = '.exe' if windows else ''
          target = Path(os.environ['CARGO_TARGET_DIR'])
          candidates = [
              ('egui', 'Veranda egui comparison', target / 'release' / ('veranda-egui-comparison' + extension)),
              ('gtk', 'Veranda GTK comparison', (Path('target/msys2') if windows else target) / 'release' / ('veranda-gtk-comparison' + extension)),
              ('slint', 'Veranda Slint comparison', target / 'release' / ('veranda-slint-comparison' + extension)),
              ('qt', 'Veranda Qt Widgets comparison', target / 'qt' / ('Release' if windows else '') / ('veranda-qt-comparison' + extension)),
              ('tauri', 'Veranda Tauri comparison', target / 'release' / ('veranda-tauri-comparison' + extension)),
          ]
          selected = json.loads(os.environ['SELECTED_FRAMEWORKS'])
          candidates = [candidate for candidate in candidates if candidate[0] in selected]
          assert [name for name, _, _ in candidates] == selected, 'Invalid selected framework list'
          root = os.environ.get('OUTPUT_ROOT', 'artifacts')
          Path(root).mkdir(parents=True, exist_ok=True)
          Path(root, 'selected-candidates.json').write_text(json.dumps([name for name, _, _ in candidates]))
          if root == 'artifacts':
              sizes = {}
              for name, _, executable in candidates:
                  if executable.is_file():
                      entry = dict(executable=str(executable), executable_bytes=executable.stat().st_size)
                      if windows and name == 'qt':
                          entry['deployed_directory_bytes'] = sum(p.stat().st_size for p in executable.parent.rglob('*') if p.is_file())
                      sizes[name] = entry
              Path('artifacts/build/binary-sizes.json').write_text(json.dumps(sizes, indent=2) + '\n')
          failed = []
          for name, title, executable in candidates:
              command = [os.environ['PROBE_PYTHON'], 'tools/native_probe.py', '--name', name,
                         '--title', title, '--executable', str(executable),
                         '--output', root + '/' + name]
              if sys.platform != 'darwin':
                  command += ['--client-size', '960', '640']
              if os.environ['COMPARISON'] == 'true' and root == 'artifacts':
                  command += ['--comparison']
              try:
                  probe = subprocess.Popen(command)
                  if probe.wait(timeout=480):
                      failed.append(name)
                  try:
                      outcome = json.loads(Path(root, name, 'outcome.json').read_text())
                  except (OSError, ValueError):
                      outcome = {}
                  if (outcome.get('cleanup_status') not in ('clean', 'not_needed')
                          or outcome.get('cleanup_survivors') or outcome.get('process_access_denied_pids')):
                      if name not in failed:
                          failed.append(name)
                      Path(root, 'stopped-after.json').write_text(json.dumps(
                          {'name': name, 'reason': 'Cleanup failed, unknown or missing; later candidates refused'}))
                      break
              except subprocess.TimeoutExpired:
                  family = psutil.Process(probe.pid).children(recursive=True)
                  for process in reversed(family):
                      try:
                          process.terminate()
                      except psutil.NoSuchProcess:
                          pass
                  probe.terminate()
                  _, alive = psutil.wait_procs(family, timeout=3)
                  for process in alive:
                      try:
                          process.kill()
                      except psutil.NoSuchProcess:
                          pass
                  probe.wait(timeout=5)
                  failed.append(name)
                  Path(root, name).mkdir(exist_ok=True)
                  Path(root, name, 'outcome.json').write_text(json.dumps(
                      {'name': name, 'status': 'failed', 'cleanup_status': 'unknown', 'reason': 'Probe exceeded 480s watchdog; subsequent candidates refused to avoid contamination'}))
                  # The probe normally cleans its own process family. A watchdog expiry
                  # leaves scope unknown, so do not run another candidate on this runner.
                  break
          Path(root, 'failed-candidates.json').write_text(json.dumps(failed))
          PY
          if [ "$RUNNER_OS" = Linux ]; then
            export LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 QT_QPA_PLATFORM=xcb XDG_SESSION_TYPE=x11
            dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' bash -c 'openbox > artifacts/build/openbox.log 2>&1 & glxinfo -B > artifacts/build/glxinfo.txt; "$PROBE_PYTHON" artifacts/run_candidates.py'
          else
            "$PROBE_PYTHON" artifacts/run_candidates.py
          fi
      - name: Relaunch in system dark mode
        if: env.APPEARANCE == 'true' && hashFiles('artifacts/failed-candidates.json') != ''
        continue-on-error: true
        timeout-minutes: 20
        env:
          OUTPUT_ROOT: artifacts/dark
          COMPARISON: 'false'
        run: |
          mkdir -p artifacts/dark
          case "$RUNNER_OS" in
            Windows)
              reg add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' //v AppsUseLightTheme //t REG_DWORD //d 0 //f
              reg add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' //v SystemUsesLightTheme //t REG_DWORD //d 0 //f
              reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' > artifacts/dark/system-setting.txt
              "$PROBE_PYTHON" artifacts/run_candidates.py
              ;;
            macOS)
              # perl alarm bounds a possible Automation permission wait.
              perl -e 'alarm 30; exec @ARGV' osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' \
                > artifacts/dark/osascript.log 2>&1 || defaults write -g AppleInterfaceStyle -string Dark
              defaults read -g AppleInterfaceStyle > artifacts/dark/system-setting.txt 2>&1
              "$PROBE_PYTHON" artifacts/run_candidates.py
              ;;
            Linux)
              # The freedesktop "system" preference: Settings portal color-scheme 1 (prefer dark).
              mkdir -p "$HOME/.config/xdg-desktop-portal"
              printf '[preferred]\ndefault=gtk\n' > "$HOME/.config/xdg-desktop-portal/portals.conf"
              export LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 QT_QPA_PLATFORM=xcb XDG_SESSION_TYPE=x11 XDG_CURRENT_DESKTOP=GNOME
              dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' bash -c '
                openbox > artifacts/dark/openbox.log 2>&1 &
                gsettings set org.gnome.desktop.interface color-scheme prefer-dark
                /usr/libexec/xdg-desktop-portal-gtk > artifacts/dark/portal-gtk.log 2>&1 &
                /usr/libexec/xdg-desktop-portal --replace > artifacts/dark/portal.log 2>&1 &
                sleep 3
                gdbus call --session --dest org.freedesktop.portal.Desktop --object-path /org/freedesktop/portal/desktop \
                  --method org.freedesktop.portal.Settings.ReadOne org.freedesktop.appearance color-scheme \
                  > artifacts/dark/system-setting.txt 2>&1
                "$PROBE_PYTHON" artifacts/run_candidates.py'
              ;;
          esac
      - name: Compare light and dark captures
        if: env.APPEARANCE == 'true' && hashFiles('artifacts/dark/selected-candidates.json') != ''
        continue-on-error: true
        run: |
          "$PROBE_PYTHON" - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageStat

          def luminance(path):
              # Skip the macOS titlebar and outer border; mean of the client's luma, 0-255.
              with Image.open(path) as image:
                  gray = image.convert('L')
                  return round(ImageStat.Stat(gray.crop((20, 60, gray.width - 20, gray.height - 20))).mean[0], 1)

          result = {}
          for name in json.loads(Path('artifacts/dark/selected-candidates.json').read_text()):
              light, dark = Path('artifacts', name, 'diagnostic.png'), Path('artifacts/dark', name, 'diagnostic.png')
              entry = dict(light_mean_luma=luminance(light) if light.exists() else None,
                           dark_mean_luma=luminance(dark) if dark.exists() else None)
              if entry['light_mean_luma'] is not None and entry['dark_mean_luma'] is not None:
                  entry['follows_dark_mode'] = entry['dark_mean_luma'] < 110 and entry['light_mean_luma'] - entry['dark_mean_luma'] > 60
              result[name] = entry
          Path('artifacts/dark/appearance-summary.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ github.run_id }}-r${{ matrix.repetition }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Require every configured footprint result
        run: |
          "$PROBE_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('artifacts/failed-candidates.json')
          assert path.exists(), 'Probe stage did not finish; inspect setup/build logs'
          failures = json.loads(path.read_text())
          assert not failures, f'Diagnostics incomplete or failed: {failures}; inspect outcome.json and screenshots'
          expected = 'comparison_passed' if os.environ['COMPARISON'] == 'true' else 'diagnostic_passed'
          names = ('egui', 'gtk', 'slint', 'qt', 'tauri')
          selected = json.loads(os.environ['SELECTED_FRAMEWORKS'])
          assert selected and selected == [name for name in names if name in selected], 'Invalid selected framework list'
          recorded = json.loads(Path('artifacts/selected-candidates.json').read_text())
          assert recorded == selected, f'Candidate selection mismatch: {recorded} != {selected}'
          outcomes = list(Path('artifacts').glob('*/outcome.json'))
          assert len(outcomes) == len(selected), f'Expected {len(selected)} outcomes, found {len(outcomes)}'
          for name in selected:
              outcome = json.loads(Path('artifacts', name, 'outcome.json').read_text())
              assert outcome['status'] == expected, f'{name}: expected {expected}, got {outcome["status"]}'
              assert outcome['cleanup_status'] == 'clean', f'{name}: cleanup was not verified'
              if expected == 'comparison_passed':
                  assert outcome['phases']['comparison']['summary']['sample_intervals'] == 120
          PY
