name: Native desktop comparison
run-name: "Desktop baseline: ${{ inputs.platforms || contains(github.event.head_commit.message, '[windows-only]') && 'windows' || contains(github.event.head_commit.message, '[macos-only]') && 'macos' || contains(github.event.head_commit.message, '[linux-only]') && 'linux' || 'all' }} / ${{ inputs.framework || 'all' }} (${{ github.event_name }})"

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Windows, macOS, native pair, Linux X11, or all three'
        type: choice
        options: [native, windows, macos, linux, all]
        default: all
      framework:
        description: 'all or comma-separated egui,gtk,slint,qt,tauri'
        type: string
        default: all
      comparison:
        description: 'Idle: 30s settling, 120 intervals; Linux also minimized'
        type: boolean
        default: true
      appearance:
        description: 'Also verify dark-startup and same-process transitions (first repetition)'
        type: boolean
        default: true
      reduced_control:
        description: 'Measure a separately labeled reduced egui A/B control, never a primary candidate'
        type: boolean
        default: true
      repetitions:
        description: 'Independent repetitions per OS on fresh runner VMs'
        type: choice
        options: ['1', '3', '5']
        default: '3'
  push:
    branches: ['codex/**']
    paths: ['examples/**', 'tools/**', '.github/workflows/native-comparison.yml']

permissions:
  contents: read

jobs:
  native:
    # Explicit commit markers opt a development branch into expensive desktop runs.
    # Smoke = all OS acceptance checks without ranked timings; benchmark = 3 fresh VMs/OS.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[desktop-smoke]') || contains(github.event.head_commit.message, '[desktop-benchmark]')
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        repetition: ${{ fromJSON(inputs.repetitions == '1' && '[1]' || contains(github.event.head_commit.message, '[desktop-smoke]') && '[1]' || inputs.repetitions == '5' && '[1,2,3,4,5]' || '[1,2,3]') }}
        os: ${{ fromJSON((inputs.platforms == 'windows' || contains(github.event.head_commit.message, '[windows-only]')) && '["windows-2022"]' || (inputs.platforms == 'macos' || contains(github.event.head_commit.message, '[macos-only]')) && '["macos-15"]' || (inputs.platforms == 'linux' || contains(github.event.head_commit.message, '[linux-only]')) && '["ubuntu-24.04"]' || inputs.platforms == 'native' && '["windows-2022","macos-15"]' || '["windows-2022","macos-15","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      COMPARISON: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop-benchmark]') || inputs.comparison == true }}
      DESKTOP_CHECKS: 'true'
      REDUCED_CONTROL: ${{ github.event_name == 'push' || inputs.reduced_control == true }}
      FRAMEWORK: ${{ inputs.framework || 'all' }}
      APPEARANCE: ${{ (github.event_name == 'push' || inputs.appearance == true) && matrix.repetition == 1 }}
      REPETITION: ${{ matrix.repetition }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: probe_python
        with:
          python-version: '3.12'
      - name: Validate selected frameworks
        run: |
          "${{ steps.probe_python.outputs.python-path }}" - <<'PY'
          import json, os
          from pathlib import Path
          names = ('egui', 'gtk', 'slint', 'qt', 'tauri')
          requested = [name.strip() for name in os.environ['FRAMEWORK'].split(',')]
          if requested == ['all']:
              selected = list(names)
          else:
              assert all(requested), 'Empty framework selection'
              assert len(requested) == len(set(requested)), 'Duplicate framework'
              assert all(name in names for name in requested), f'Unknown framework: {requested}'
              selected = [name for name in names if name in requested]
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write('SELECTED_FRAMEWORKS=' + json.dumps(selected) + '\n')
              output.write('FRAMEWORK=' + ','.join(selected) + '\n')
              output.write('NEED_RUST=' + str(bool(set(selected) & {'egui', 'gtk', 'slint', 'tauri'})).lower() + '\n')
          print('Selected frameworks:', selected)
          PY
      - uses: dtolnay/rust-toolchain@stable
        if: env.NEED_RUST == 'true'
      - name: Prepare probe and source evidence
        run: |
          mkdir -p artifacts/build target
          PROBE_PYTHON="${{ steps.probe_python.outputs.python-path }}"
          echo "PROBE_PYTHON=$PROBE_PYTHON" >> "$GITHUB_ENV"
          "$PROBE_PYTHON" -m pip install psutil==7.0.0 Pillow==11.2.1
          if [ "$RUNNER_OS" = macOS ]; then
            "$PROBE_PYTHON" -m pip install pyobjc-framework-Quartz==11.0
          fi
          "$PROBE_PYTHON" -c 'import sys, psutil, PIL; print(sys.executable)' > artifacts/build/probe-python.txt
          "$PROBE_PYTHON" tools/record_source.py
          if [ "$NEED_RUST" = true ]; then
            rustc -Vv > artifacts/build/rust-version.txt
            cargo -V >> artifacts/build/rust-version.txt
          fi
          cmake --version > artifacts/build/cmake-version.txt
      - name: Probe and importer regression tests
        run: '"$PROBE_PYTHON" -m unittest discover -s tools -p "test_*.py"'
      - name: Linux build and X11 runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libgtk-4-dev libadwaita-1-dev libgtk-3-dev libgtk-3-bin libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-cursor0 libxkbcommon-x11-0 libxkbcommon-dev libgl1-mesa-dev xvfb openbox xdotool xclip x11-utils imagemagick dbus-x11 mesa-utils xdg-desktop-portal xdg-desktop-portal-gtk gsettings-desktop-schemas gnome-settings-daemon gnome-themes-extra-data dconf-service dconf-cli libglib2.0-bin
          pkg-config --modversion gtk4 libadwaita-1 gtk+-3.0 webkit2gtk-4.1 > artifacts/build/native-versions.txt
          dpkg-query -W gnome-settings-daemon gnome-themes-extra-data libgtk-3-bin libgtk-3-0t64 libgtk-4-1 libadwaita-1-0 libwebkit2gtk-4.1-0 libgl1-mesa-dri xdg-desktop-portal xdg-desktop-portal-gtk > artifacts/build/linux-desktop-versions.txt
      - name: Qt 6.8.3 for Linux with matching GNOME platform theme
        if: runner.os == 'Linux' && contains(env.SELECTED_FRAMEWORKS, 'qt')
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Verify Linux Qt deployment
        if: runner.os == 'Linux' && contains(env.SELECTED_FRAMEWORKS, 'qt')
        run: |
          qmake -query > artifacts/build/qt-runtime.txt
          test -f "$(qmake -query QT_INSTALL_PLUGINS)/platformthemes/libqgtk3.so"
          ldd "$(qmake -query QT_INSTALL_PLUGINS)/platformthemes/libqgtk3.so" > artifacts/build/qt-gtk3-dependencies.txt
      - name: Qt 6.8.3 for Windows
        if: runner.os == 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'qt')
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: GTK4 and libadwaita Windows toolchain
        if: runner.os == 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'gtk')
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-rust
      - name: Build gtk4-rs and libadwaita on Windows
        if: runner.os == 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'gtk')
        continue-on-error: true
        shell: msys2 {0}
        run: bash tools/windows-setup.sh
      - name: Native macOS libraries
        if: runner.os == 'macOS' && (contains(env.SELECTED_FRAMEWORKS, 'qt') || contains(env.SELECTED_FRAMEWORKS, 'gtk'))
        run: |
          packages=(pkgconf)
          if [[ ",$FRAMEWORK," == *,qt,* ]]; then packages+=(qtbase); fi
          if [[ ",$FRAMEWORK," == *,gtk,* ]]; then packages+=(gtk4 libadwaita); fi
          brew install "${packages[@]}" 2>&1 | tee artifacts/build/brew.log
          brew list --versions "${packages[@]}" > artifacts/build/native-versions.txt
          if [[ ",$FRAMEWORK," == *,qt,* ]]; then
            echo "Qt6_DIR=$(brew --prefix qtbase)/lib/cmake/Qt6" >> "$GITHUB_ENV"
          fi
      - name: Record Windows WebView2 installation
        if: runner.os == 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'tauri')
        shell: pwsh
        run: |
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue
          if ($runtime) {
            $runtime | ForEach-Object { $_.VersionInfo.FileVersion } | Out-File artifacts/build/webview2-version.txt
          } else {
            'WebView2 not found; launch will validate availability.' | Out-File artifacts/build/webview2-version.txt
          }
      - name: Preserve exact Cargo features and locks without mutating source
        if: env.NEED_RUST == 'true'
        run: |
          for example in egui gtk slint tauri; do
            if [[ ",$FRAMEWORK," != *,"$example",* ]]; then continue; fi
            cargo fmt --check --manifest-path "examples/$example/Cargo.toml"
            cp "examples/$example/Cargo.lock" "artifacts/build/$example-Cargo.lock"
            cargo tree --locked -e features --manifest-path "examples/$example/Cargo.toml" > "artifacts/build/$example-features.txt"
          done
          if [[ ",$FRAMEWORK," == *,egui,* ]] && [ "$REDUCED_CONTROL" = true ]; then
            cargo tree --locked --no-default-features -e features --manifest-path examples/egui/Cargo.toml > artifacts/build/egui-reduced-features.txt
          fi
      - name: Build reduced egui diagnostic control
        if: contains(env.SELECTED_FRAMEWORKS, 'egui') && env.REDUCED_CONTROL == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          cargo build --release --locked --no-default-features --manifest-path examples/egui/Cargo.toml 2>&1 | tee artifacts/build/egui-reduced.log
          ext=''; [ "$RUNNER_OS" = Windows ] && ext='.exe'
          mv "$CARGO_TARGET_DIR/release/veranda-egui-comparison$ext" "$CARGO_TARGET_DIR/release/veranda-egui-reduced-comparison$ext"
      - name: Build egui desktop release
        if: contains(env.SELECTED_FRAMEWORKS, 'egui')
        continue-on-error: true
        timeout-minutes: 20
        run: cargo build --release --locked --manifest-path examples/egui/Cargo.toml 2>&1 | tee artifacts/build/egui.log
      - name: Test egui Settings portal transport on an isolated bus
        id: portal_test
        if: runner.os == 'Linux' && contains(env.SELECTED_FRAMEWORKS, 'egui')
        continue-on-error: true
        timeout-minutes: 15
        run: |
          cargo test --release --locked --manifest-path examples/egui/Cargo.toml --no-run 2>&1 | tee artifacts/build/egui-test-build.log
          timeout 60s dbus-run-session -- env COMPARISON_TEST_ISOLATED_DBUS=1 cargo test --release --locked --manifest-path examples/egui/Cargo.toml portal_round_trip -- --ignored 2>&1 | tee artifacts/build/egui-portal-test.log
      - name: Build Slint release
        if: contains(env.SELECTED_FRAMEWORKS, 'slint')
        continue-on-error: true
        timeout-minutes: 20
        run: cargo build --release --locked --manifest-path examples/slint/Cargo.toml 2>&1 | tee artifacts/build/slint.log
      - name: Build Tauri release
        if: contains(env.SELECTED_FRAMEWORKS, 'tauri')
        continue-on-error: true
        timeout-minutes: 20
        run: cargo build --release --locked --manifest-path examples/tauri/Cargo.toml 2>&1 | tee artifacts/build/tauri.log
      - name: Build Qt Widgets release
        if: contains(env.SELECTED_FRAMEWORKS, 'qt')
        continue-on-error: true
        run: |
          cmake -S examples/qt -B target/qt -DCMAKE_BUILD_TYPE=Release 2>&1 | tee artifacts/build/qt-configure.log
          cmake --build target/qt --config Release 2>&1 | tee artifacts/build/qt-build.log
          if [ "$RUNNER_OS" = Windows ]; then
            windeployqt --release --no-translations target/qt/Release/veranda-qt-comparison.exe 2>&1 | tee artifacts/build/qt-deploy.log
          else
            strip target/qt/veranda-qt-comparison
          fi
      - name: Build GTK4 plus libadwaita on Unix
        if: runner.os != 'Windows' && contains(env.SELECTED_FRAMEWORKS, 'gtk')
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pkg-config --modversion gtk4 > artifacts/build/gtk-version.txt
          pkg-config --modversion libadwaita-1 > artifacts/build/libadwaita-version.txt
          cargo build --release --locked --manifest-path examples/gtk/Cargo.toml 2>&1 | tee artifacts/build/gtk.log
      - name: Verify build did not mutate benchmark sources
        run: '"$PROBE_PYTHON" tools/record_source.py'
      - name: Run desktop profiles and reduced control sequentially
        timeout-minutes: 55
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            bash tools/run_x11_session.sh "$PROBE_PYTHON" tools/run_native_candidates.py
          else
            "$PROBE_PYTHON" tools/run_native_candidates.py
          fi
      - name: Verify dark startup and live transitions
        if: env.APPEARANCE == 'true' && hashFiles('artifacts/failed-candidates.json') != ''
        timeout-minutes: 20
        env:
          COMPARISON: 'false'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            bash tools/run_x11_session.sh "$PROBE_PYTHON" tools/run_native_candidates.py --output artifacts/dark --startup-theme dark
          else
            "$PROBE_PYTHON" tools/run_native_candidates.py --output artifacts/dark --startup-theme dark
          fi
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ github.run_id }}-r${{ matrix.repetition }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Require every configured desktop footprint result
        run: '"$PROBE_PYTHON" tools/run_native_candidates.py --verify-only'
      - name: Require Settings portal transport test
        if: always() && steps.portal_test.outcome == 'failure'
        run: exit 1
      - name: Require dark startup and live transitions
        if: env.APPEARANCE == 'true'
        env:
          COMPARISON: 'false'
        run: '"$PROBE_PYTHON" tools/run_native_candidates.py --output artifacts/dark --startup-theme dark --verify-only'
