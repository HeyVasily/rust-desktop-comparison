[package]
name = "veranda-slint-comparison"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "=0.6.2"
