[package]
name = "veranda-gtk-comparison"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "=0.11.5" }
# Normal GNOME/GTK desktop integration, including event-driven system appearance.
adw = { package = "libadwaita", version = "=0.9.2", optional = true }

# Optional shell-integration checks; the measured build does not enable them.
tray-icon = { version = "=0.25.1", default-features = false, features = ["ksni"], optional = true }
global-hotkey = { version = "=0.9.0", optional = true }
single-instance = { version = "=0.3.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gdk4-x11 = { version = "=0.11.5", optional = true }

[features]
default = ["desktop"]
desktop = ["dep:adw"]
shell-checks = ["dep:tray-icon", "dep:global-hotkey", "dep:single-instance", "dep:gdk4-x11"]

[profile.release]
strip = true
