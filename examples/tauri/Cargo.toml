[package]
name = "veranda-tauri-comparison"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow", "objc2-core-foundation"] }

[features]
# Embed the static frontend when building directly with Cargo, without the Tauri CLI.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
