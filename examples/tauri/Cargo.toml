[package]
name = "veranda-tauri-comparison"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[features]
# Embed the static frontend when building directly with Cargo, without the Tauri CLI.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
